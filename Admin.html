<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--pink:#c85d8f;--soft:#f8c8dc;--pale:#fde4ee;--cream:#fff7f4;--brown:#3b1d18}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,sans-serif;line-height:1.5}
    main{max-width:1050px;margin:auto;padding:28px}.card{background:white;border:3px solid var(--soft);border-radius:20px;padding:22px;margin-bottom:22px;box-shadow:6px 6px 0 var(--soft)}
    h1,h2{color:var(--pink)}button{border:0;border-radius:999px;padding:12px 18px;background:var(--pink);color:white;font-weight:800;cursor:pointer;margin:4px}button.secondary{background:var(--brown)}button.danger{background:#9c2f45}
    input,textarea{width:100%;padding:12px;border:2px solid var(--soft);border-radius:12px;margin:6px 0 14px}label{font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.status{font-size:1.35rem;font-weight:900}.date-row,.week-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
    .pill{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--pale);font-weight:800}.error{color:#9c2f45;font-weight:800}.success{color:#246b45;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.date-row,.week-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Baked with Hope Owner Dashboard</h1>
  <p id="message">Loading owner controls…</p>

  <section class="card">
    <h2>Ordering switch</h2>
    <p class="status">Current status: <span id="mode">—</span></p>
    <button onclick="setMode('OPEN')">Open ordering</button>
    <button class="danger" onclick="setMode('CLOSED')">Close ordering</button>
  </section>

  <div class="grid">
    <section class="card">
      <h2>Approve a pickup date</h2>
      <label for="date">Date</label><input type="date" id="date">
      <label for="note">Private note</label><input id="note" placeholder="Holiday pickup, vacation, etc.">
      <button onclick="saveDate(true)">Approve date</button>
      <button class="secondary" onclick="saveDate(false)">Mark unavailable</button>
    </section>

    <section class="card">
      <h2>Settings</h2>
      <label for="limit">Weekly order limit</label><input type="number" id="limit" min="1" max="100">
      <label for="closedTitle">Closed title</label><input id="closedTitle">
      <label for="closedMessage">Closed message</label><textarea id="closedMessage"></textarea>
      <button onclick="saveSettings()">Save settings</button>
    </section>
  </div>

  <section class="card"><h2>Approved and blocked dates</h2><div id="dates"></div></section>
  <section class="card"><h2>Weekly capacity</h2><div id="weeks"></div></section>
</main>
<script>
  let dashboard;
  function call(name, ...args){
    document.getElementById('message').textContent='Saving…';
    google.script.run.withSuccessHandler(render).withFailureHandler(showError)[name](...args);
  }
  function load(){ call('getAdminDashboardData'); }
  function render(data){
    dashboard=data; document.getElementById('message').textContent=`Verified owner: ${data.signedInEmail || data.ownerEmail}`;
    document.getElementById('message').className='success';
    document.getElementById('mode').textContent=data.settings.ORDERING_MODE || 'CLOSED';
    document.getElementById('limit').value=data.settings.WEEKLY_LIMIT || 10;
    document.getElementById('closedTitle').value=data.settings.CLOSED_TITLE || '';
    document.getElementById('closedMessage').value=data.settings.CLOSED_MESSAGE || '';
    document.getElementById('dates').innerHTML=data.approvedDates.length ? data.approvedDates.map(row=>`<div class="date-row"><div><strong>${row.date}</strong><br><small>${escapeHtml(row.note)}</small></div><span class="pill">${row.available?'Available':'Unavailable'}</span><button class="danger" onclick="deleteDate('${row.date}')">Delete</button></div>`).join('') : '<p>No dates have been added yet.</p>';
    document.getElementById('weeks').innerHTML=data.weeks.length ? data.weeks.map(row=>`<div class="week-row"><strong>Week of ${row.weekKey}</strong><span>${row.count} / ${row.limit}</span><span class="pill">${row.soldOut?'SOLD OUT':'Open capacity'}</span></div>`).join('') : '<p>No submitted orders yet.</p>';
  }
  function showError(error){ document.getElementById('message').textContent=error.message || error; document.getElementById('message').className='error'; }
  function setMode(mode){ call('adminSetOrderingMode',mode); }
  function saveDate(available){ const date=document.getElementById('date').value; if(!date)return showError({message:'Choose a date first.'}); call('adminSetDateAvailability',date,available,document.getElementById('note').value); }
  function deleteDate(date){ call('adminDeleteAvailabilityDate',date); }
  function saveSettings(){ call('adminSaveSettings',{weeklyLimit:document.getElementById('limit').value,closedTitle:document.getElementById('closedTitle').value,closedMessage:document.getElementById('closedMessage').value}); }
  function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  load();
</script>
</body>
</html>
